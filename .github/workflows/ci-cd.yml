# Java 26 Spring Boot CI/CD
# GitHub: AzizulHakim00/omor_docker
# Docker Hub: azizulhakimomor/omor_docker:latest2

name: Spring Boot CI/CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE_NAME: azizulhakimomor/omor_docker
  CONTAINER_NAME: spring-boot-app
  APP_PORT: "8080"

jobs:
  build-and-push:
    name: Build JAR and publish Docker image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java 26
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "26"
          cache: maven

      - name: Build and test Spring Boot JAR
        run: |
          chmod +x ./mvnw
          ./mvnw -B --no-transfer-progress clean verify

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest2
            ${{ env.IMAGE_NAME }}:${{ github.sha }}

  deploy-ec2:
    name: Deploy to AWS EC2 (optional)
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Check EC2 configuration
        id: ec2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          if [[ -n "$EC2_HOST" && -n "$EC2_USER" && -n "$EC2_SSH_KEY" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "EC2 secrets not configured; skipping deployment."
          fi

      - name: Pull and deploy on EC2
        if: steps.ec2.outputs.enabled == 'true'
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            IMAGE="${{ env.IMAGE_NAME }}:${{ github.sha }}"
            docker pull "$IMAGE"
            docker rm -f "${{ env.CONTAINER_NAME }}" 2>/dev/null || true
            docker run -d \
              --name "${{ env.CONTAINER_NAME }}" \
              --restart unless-stopped \
              -p "${{ env.APP_PORT }}:8080" \
              "$IMAGE"
            docker ps --filter "name=${{ env.CONTAINER_NAME }}"
